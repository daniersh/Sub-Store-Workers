name: Sync from Upstream

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          ref: multi-tenant

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream "https://github.com/${{ vars.UPSTREAM_REPO }}.git"
          git fetch upstream

      - name: Check upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/multi-tenant 2>/dev/null || echo "0")
          echo "Commits behind: $BEHIND"
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT

      - name: Sync and push
        if: steps.check.outputs.behind != '0'
        run: |
          git merge upstream/multi-tenant --no-edit || {
            git fetch --all
            git reset --hard upstream/multi-tenant
          }
          git push --force-with-lease origin multi-tenant
